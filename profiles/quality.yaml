# quality: one big model across all 8 GPUs (larger quant, same 4x64k slots). Not yet downloaded/tested.
description: MiniMax-M2.7 UD-Q5_K_XL on all 8 GPUs
defaults:
  parallel: 4
  ctx_per_slot: 65536
  kv_type: q8_0
  args: [--cache-reuse, "256", --cache-ram, "65536", --fit, "off"]
instances:
  minimax:
    alias: minimax-m2
    model:
      repo: unsloth/MiniMax-M2.7-GGUF
      include: "UD-Q5_K_XL/*"
      file: UD-Q5_K_XL/MiniMax-M2.7-UD-Q5_K_XL-00001-of-00005.gguf
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    n_cpu_moe: 8   # estimate: ~158 GiB weights + ~35 GiB KV exceeds 8x22.5 GiB; tune before use
    numa: interleave
    port: 8101
    args: [--threads, "28"]
