# speed: 4x fast model, one per NVLink pair (0-1, 2-3, 4-5, 6-7). Not yet tested.
description: 4x Qwen3-Coder-30B-A3B Q8_0, one per NVLink pair
defaults:
  alias: qwen3-coder-30b
  model:
    repo: unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF
    file: Qwen3-Coder-30B-A3B-Instruct-Q8_0.gguf
  parallel: 4
  ctx_per_slot: 65536
  kv_type: q8_0
  args: [--cache-reuse, "256", --cache-ram, "16384", --fit, "off", --threads, "8"]
instances:
  qwen-a: {gpus: [0, 1], port: 8111}
  qwen-b: {gpus: [2, 3], port: 8112}
  qwen-c: {gpus: [4, 5], port: 8113}
  qwen-d: {gpus: [6, 7], port: 8114}
