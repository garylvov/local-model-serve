; 8x-24g: eight 24 GB GPUs (tested on RTX A5000, 22.5 GiB usable each), ~1 TB RAM.
; llama-server router preset (tools/server/README.md "Model presets"). One section = one model id.
; `; match:` lines are extra names for `llm up <name>` fuzzy matching (ignored by llama-server).
version = 1

[*]
; hide raw cache entries that duplicate a preset section in GET /models
dedup-cache-models = true
jinja = true
flash-attn = on
n-gpu-layers = 999
metrics = true
parallel = 4
cache-type-k = q8_0
cache-type-v = q8_0
; agents resend a growing context: reuse cached prefix chunks (needs the prompt cache, on by default)
cache-reuse = 256
cache-ram = 32768
; SSE ":" ping while a stream is idle (only after the first token; see _out.md)
sse-ping-interval = 15
stop-timeout = 30
; Reasoning effort is the MODEL's own control (its chat template validates the values), not a
; token cap. Qwen3.8 (27b + Flash-Next) supports low / medium / xhigh and DEFAULTS TO xhigh, which
; is what made a replica loop in <think> for thousands of tokens on 2026-09-16. medium is the
; sensible default for agent work; pass {"reasoning_effort":"xhigh"} per request for hard problems.
chat-template-kwargs = {"reasoning_effort":"medium"}

; Main model for GPUs 0-5 (operator pick 2026-09-16): 180B total / ~6B active MoE, 48 layers
; (36 linear + 12 full attn, 2 KV heads -> small KV). UD-Q4_K_XL = 103.7 GiB.
; Known upstream issues: hallucination/vision reports #27886, `-sm tensor` disabled, MTP not merged.
[qwen3.8-flash-next]
; Kept resident on GPUs 0-4 (operator 2026-09-16). UD-Q4_K_XL = 103.7 GiB needs >= 5 cards, so it
; can never run on one; measured 28 tok/s (layer split runs the GPUs in turn). Quality is the
; reason to keep it: Terminal-Bench 86.1 vs 79.8 for the 27b (Artificial Analysis).
load-on-startup = true
; match: flashnext flash next big main
hf-repo = unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
no-mmproj = true
device = CUDA0,CUDA1,CUDA2,CUDA3,CUDA4
ctx-size = 131072
threads = 16


[qwen3.8-27b-vision]
; the only vision instance: no draft model here (drafting + mmproj stalls images, #27408)
; match: vision vl image
load-on-startup = true
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
; mmproj comes from the same -hf repo automatically (mmproj-auto is on by default)
device = CUDA7
ctx-size = 65536
parallel = 2
image-min-tokens = 1024
image-max-tokens = 4096

[qwen3.8-27b]
; superseded by the @N replicas (operator 2026-09-16); load manually if you want one big-ctx copy
; match: qwen qwen3.8 qwen-27b fast
; dense 27.8B (qwen35 arch, vision via mmproj). UD-Q5_K_XL = 19.4 GiB + mmproj-F16 0.86 GiB.
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q5_K_XL
; text-only instance: see [qwen3.8-27b-vision] for images
no-mmproj = true
device = CUDA6,CUDA7
ctx-size = 262144
threads = 8
; MTP speculative decoding, on by default (operator 2026-09-16). MEASURED on GPUs 0-1 with the Q4
; weights: 26.2 -> 72 tok/s (2.7x), draft acceptance 0.95-0.97, mean accepted run 3.9 tokens.
; Draft weights ship in the same unsloth repo under MTP/. Keep this OUT of any preset with an
; mmproj: drafting + vision stalls image requests ~500 s and 500s (llama.cpp issue #27408).
spec-draft-hf = unsloth/Qwen3.8-27B-GGUF
spec-draft-model = MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-ngl = 99

; ---- qwen3.8-27b replicas: one copy per GPU, each with the MTP draft (16.4 + 1.3 GiB of 22.5).
; The gateway collapses `qwen3.8-27b@N` to `qwen3.8-27b` and sends each request to the least busy
; copy, so N agents get a full-speed stream each instead of sharing slots on one instance.
; MEASURED 2026-09-16: 64 tok/s per copy (26 without the draft), draft acceptance 0.95.

[qwen3.8-27b@1]
load-on-startup = true
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
no-mmproj = true
device = CUDA5
ctx-size = 65536
parallel = 1
threads = 8
spec-draft-hf = unsloth/Qwen3.8-27B-GGUF
spec-draft-model = MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-ngl = 99

[qwen3.8-27b@2]
load-on-startup = true
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
no-mmproj = true
device = CUDA6
ctx-size = 65536
parallel = 1
threads = 8
spec-draft-hf = unsloth/Qwen3.8-27B-GGUF
spec-draft-model = MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-ngl = 99





; ---- Kimi-K3 (2.8T MoE, ~50B active) at UD-Q2_K_XL = 802 GiB: attention on the GPUs, routed
; experts in system RAM (needs ~1 TB). NOT loaded on startup. Load cost is dominated by
; llama.cpp's single-threaded reader: MEASURED 47+ min cold over NFS. Pre-warm the page cache
; first (`scripts/prewarm.sh <shard> 19`: 802 GiB in 249 s) and the mmap load then takes 61 s.
[kimi-k3]
; match: kimi k3 moonshot
hf-repo = unsloth/Kimi-K3-GGUF:UD-Q2_K_XL
no-mmproj = true
device = CUDA0,CUDA1,CUDA2,CUDA3,CUDA4,CUDA5,CUDA6,CUDA7
n-cpu-moe = 999
load-mode = mmap
numa = distribute
ctx-size = 16384
parallel = 1
threads = 32

; ---- DeepSeek-V4-Flash-0731 (304B MoE). Fits ENTIRELY in 8x22.5 GiB VRAM: UD-IQ4_NL = 127.3 GiB
; (~53 GiB left for KV/buffers), UD-Q8_K_XL = 150.8 GiB (~29 GiB left). Not loaded on startup.
; Known upstream issues: `-sm tensor` segfaults (#28826) so layer split only; DSpark draft cache
; leaks VRAM (#27155) so no speculative decoding; tokenizer can overflow its stack on very long
; tool outputs (#26965).
[deepseek-v4-flash]
; match: deepseek ds4 v4 flash
hf-repo = unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ4_NL
no-mmproj = true
device = CUDA0,CUDA1,CUDA2,CUDA3,CUDA4,CUDA5,CUDA6,CUDA7
ctx-size = 65536
parallel = 2
threads = 16
