; single-24g: one 24 GB GPU (RTX 3090/4090/A5000-class).
version = 1

[*]
; hide raw cache entries that duplicate a preset section in GET /models
dedup-cache-models = true
jinja = true
flash-attn = on
n-gpu-layers = 999
metrics = true
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
sse-ping-interval = 15
stop-timeout = 30

[qwen3.8-27b]
; match: qwen qwen3.8 fast
; UD-Q4_K_XL 16.35 GiB + mmproj 0.86 GiB; KV is small (48 of 64 layers are linear attention).
; Qwen-VL mmproj carries no image_min_pixels; see catalog/models.yaml
image-min-tokens = 1024
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
device = CUDA0
parallel = 2
ctx-size = 131072
