; peer-test: a second router on this node, used to test gateway peer routing
; (llm serve with LLM_SESSION=llm2 LLM_PORT=8081 LLM_PRESET=peer-test).
version = 1

[*]
; hide raw cache entries that duplicate a preset section in GET /models
dedup-cache-models = true
jinja = true
flash-attn = on
n-gpu-layers = 999
metrics = true
parallel = 2
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
sse-ping-interval = 15
stop-timeout = 30

[qwen3.8-27b-q4]
load-on-startup = true
; match: q4 peer2 small
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
device = CUDA4,CUDA5
ctx-size = 131072
