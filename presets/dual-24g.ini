; dual-24g: 2x 24 GB GPUs.
version = 1

[*]
; hide raw cache entries that duplicate a preset section in GET /models
dedup-cache-models = true
jinja = true
flash-attn = on
n-gpu-layers = 999
metrics = true
parallel = 4
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
sse-ping-interval = 15
stop-timeout = 30

[qwen3.8-27b]
; match: qwen qwen3.8 fast
; Qwen-VL mmproj carries no image_min_pixels; see catalog/models.yaml
image-min-tokens = 1024
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q5_K_XL
device = CUDA0,CUDA1
ctx-size = 262144
