; quad-24g: four 24 GB GPUs. Untested.
; RAM: minimax-m2.7 below keeps ~40 of 62 layers' experts in system RAM (~85 GiB) -> needs >= 128 GiB RAM.
; With less RAM use [qwen3.8-27b] (all-GPU) or laguna-s-2.1 Q4_K_M (89.4 GiB, also needs spillover).
version = 1

[*]
; hide raw cache entries that duplicate a preset section in GET /models
dedup-cache-models = true
jinja = true
flash-attn = on
n-gpu-layers = 999
metrics = true
parallel = 4
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
sse-ping-interval = 15
stop-timeout = 30

[minimax-m2.7]
; loaded automatically by `llm serve` / `llm join`
load-on-startup = true
; match: minimax m2 m2.7 big
; 229B total / ~10B active. UD-Q4_K_XL = 131.1 GiB; KV q8_0 ~129 KiB/token -> 4x64k = 34.5 GiB.
hf-repo = unsloth/MiniMax-M2.7-GGUF:UD-Q4_K_XL
device = CUDA0,CUDA1,CUDA2,CUDA3
ctx-size = 262144
n-cpu-moe = 40
threads = 16

[qwen3.8-27b]
; match: qwen qwen3.8 fast
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q5_K_XL
device = CUDA0,CUDA1
ctx-size = 262144
