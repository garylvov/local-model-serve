; oscar-8x: 8x RTX A5000 (22.5 GiB usable each), NVLink pairs 0-1 2-3 4-5 6-7, ~1 TB RAM.
; llama-server router preset (tools/server/README.md "Model presets"). One section = one model id.
; `; match:` lines are extra names for `llm up <name>` fuzzy matching (ignored by llama-server).
version = 1

[*]
; hide raw cache entries that duplicate a preset section in GET /models
dedup-cache-models = true
jinja = true
flash-attn = on
n-gpu-layers = 999
metrics = true
parallel = 4
cache-type-k = q8_0
cache-type-v = q8_0
; agents resend a growing context: reuse cached prefix chunks (needs the prompt cache, on by default)
cache-reuse = 256
cache-ram = 32768
; SSE ":" ping while a stream is idle (only after the first token; see _out.md)
sse-ping-interval = 15
stop-timeout = 30

; Main model for GPUs 0-5 (operator pick 2026-09-16): 180B total / ~6B active MoE, 48 layers
; (36 linear + 12 full attn, 2 KV heads -> small KV). UD-Q4_K_XL = 103.7 GiB.
; Known upstream issues: hallucination/vision reports #27886, `-sm tensor` disabled, MTP not merged.
[qwen3.8-flash-next]
; match: flashnext flash next big main
hf-repo = unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
no-mmproj = true
device = CUDA0,CUDA1,CUDA2,CUDA3,CUDA4,CUDA5
ctx-size = 262144
threads = 16

; Laguna S 2.1 (Q8_0, 119.9 GiB) - NOT DOWNLOADED (abandoned 2026-09-16): its DFlash drafter is rejected by upstream
; (issue #26669) so no `spec-type` here, and issue #27899 reports CUDA NaN logits for some
; Laguna-S k-quant mixes. Generate a short sample and check for garbage before trusting it.
[laguna-s-2.1]
; match: laguna poolside
hf-repo = poolside/Laguna-S-2.1-GGUF:Q8_0
device = CUDA0,CUDA1,CUDA2,CUDA3,CUDA4,CUDA5
ctx-size = 262144
threads = 16

; Vision variant: same weights + the mmproj. Kept SEPARATE from any draft model on purpose:
; speculative decoding + mmproj stalls and 500s on image requests (llama.cpp issue #27408).
; --image-min-tokens 1024: the unsloth mmproj sets no clip.vision.image_min_pixels, and clip.cpp
; warns Qwen-VL needs >= 1024 image tokens for grounding. Raise --image-max-tokens for more detail
; (slower prefill). KV slot save/restore is unreliable for vision models (#19466).
[qwen3.8-27b-vision]
; match: vision vl image
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q5_K_XL
; mmproj comes from the same -hf repo automatically (mmproj-auto is on by default)
device = CUDA4,CUDA5
ctx-size = 131072
parallel = 2
image-min-tokens = 1024
image-max-tokens = 4096

[qwen3.8-27b]
; match: qwen qwen3.8 qwen-27b fast
; dense 27.8B (qwen35 arch, vision via mmproj). UD-Q5_K_XL = 19.4 GiB + mmproj-F16 0.86 GiB.
hf-repo = unsloth/Qwen3.8-27B-GGUF:UD-Q5_K_XL
; text-only instance: see [qwen3.8-27b-vision] for images
no-mmproj = true
device = CUDA6,CUDA7
ctx-size = 262144
threads = 8
