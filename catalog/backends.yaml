# Backend catalog: how to launch a model-serving ENGINE, independent of which model it serves.
# A preset section names one with `backend = <name>` (default: llamacpp, so every existing preset
# is unchanged). Contract modeled on llama-swap: an opaque `cmd:` template + `checkEndpoint`, so a
# brand-new engine can be added here without touching bin/llm.
#
# Template variables available to `cmd` (Python str.format style, {name}):
#   port            - port this engine instance listens on (see `port_base` below)
#   model_path      - local weights path/repo, exactly as given (repo, repo:quant, or a file path)
#   repo            - HF repo id alone (repo split off ":quant" if present)
#   quant           - quant/variant tag if the preset's `hf-repo` had one (repo:quant), else empty
#   gpu_ids         - comma-separated CUDA indices, e.g. "0,1" (from `device = CUDA0,CUDA1`)
#   gpu_count       - number of GPU indices
#   ctx_size        - context length (preset `ctx-size`, default from typed field below)
#   parallel        - concurrent slots / requests (preset `parallel`)
#   models_dir      - local weights cache dir ($LLAMA_CACHE / models/)
#   extra_args      - raw passthrough string from preset `extra-args` (escape hatch, see below)
#   mmproj_path     - multimodal projector path/repo, if the engine supports one and it was set
#   spec_model      - draft/speculative model path/repo, if the engine supports one and it was set
#   spec_json       - engine-specific JSON blob for speculative config (vLLM), built from
#                     spec_model/spec-draft-* fields when the engine declares `speculative: json`
#
# Typed fields a preset section may set, mapped per engine below (unsupported ones are a launch
# error, not a silently dropped flag - see bin/llm's `render_backend_cmd`):
#   device (GPU placement), ctx-size, parallel, hf-repo (repo[:quant]), mmproj / no-mmproj,
#   spec-draft-hf / spec-draft-model / spec-type (draft/speculative model)
# `extra_args = --foo bar --baz` on a section is passed through untouched by every engine.

backends:
  llamacpp:
    # Baseline: unchanged from before this file existed. bin/llm never renders a `cmd` for this one
    # -- llama.cpp's own router (llama-server --models-preset) owns process lifecycle, multiple
    # models per port, on-demand load/unload, and the /models status schema the gateway already
    # polls. Kept here so `llm ls` and docs have one place that lists every backend's capabilities.
    kind: router                # one shared process serves many models (see presets/*.ini)
    health_endpoint: /health
    models_endpoint: /models    # native schema: {data:[{id, status:{value}}]}; gateway understands it directly
    port_base: 8080
    supports: {gpu_placement: "--device CUDA0,CUDA1,...", context_size: "--ctx-size", parallel: "--parallel",
               quant_selection: "hf-repo:quant (llama.cpp -hf resolves the GGUF)", speculative: "spec-* flags (draft-mtp/draft)",
               mmproj: "-hf repo auto-picks mmproj, or --mmproj-url", prefix_caching: "text only - logs 'cache_reuse is not supported by multimodal' for images"}
    build:
      script: scripts/build-llama.sh
      note: "see catalog/builds.yaml for variants (master / poolside-laguna / glm53 / qwen-mtp)"

  vllm:
    # One process per model (vLLM has no multi-model router). Each instance gets its own port and
    # registers with the gateway through gateway/backend_adapter.py (translates /models to the
    # schema above and proxies everything else straight through).
    kind: single-model
    health_endpoint: /health
    models_endpoint: /v1/models     # OpenAI schema {data:[{id}]}; adapter fills status:"loaded"
    port_base: 8100
    venv: vendor/vllm-venv           # uv venv; gitignored. `uv venv vendor/vllm-venv && uv pip install -p vendor/vllm-venv/bin/python vllm`
    # MEASURED 2026-09-17 on gpu2260 (driver 575.57.08, CUDA 12.9, RTX A5000 sm_86):
    #  * plain `uv pip install vllm` pulls vllm==0.29.0 with torch==2.13.0+cu130, which needs a
    #    driver new enough for CUDA 13 - ours only supports up to CUDA 12.9, so the engine crashes
    #    at startup: "RuntimeError: The NVIDIA driver on your system is too old (found version
    #    12090)." Pin `uv pip install vllm==0.9.2` instead (torch==2.7.0+cu126, works with this
    #    driver) - transformers still resolves to a too-new 5.17.0 that vllm 0.9.2's Ovis config
    #    conflicts with ("ValueError: 'aimv2' is already used by a Transformers config"); pin
    #    `transformers==4.51.3` on top. Also needs `ninja` in the same venv (vLLM shells out to it
    #    for its Triton/inductor JIT; PATH must include `{venv}/bin`) and
    #    `--gpu-memory-utilization` sized to the GPU's ACTUAL free VRAM, not its total (vLLM's own
    #    check: "Free memory on device (8.42/22.06 GiB) ... is less than desired ...").
    #  * Served Qwen/Qwen2.5-0.5B-Instruct (BF16 safetensors) on GPU7 (deepseek-v4-flash was using
    #    all 8 GPUs, ~9 GiB free on GPU7): weights loaded 0.61 s, full engine init (profile + KV
    #    cache + CUDA graph capture) 157.45 s, 85 tok/s single-stream decode (150 tokens / 1.755 s),
    #    7.3 GiB VRAM at --gpu-memory-utilization 0.3. Automatic prefix caching (V1 default) HIT:
    #    two chat requests sharing a ~4046-token prefix logged "Prefix cache hit rate: 49.8%" and
    #    the second request's wall time dropped from 0.205 s to 0.129 s.
    cmd: >-
      {venv}/bin/vllm serve {repo}
      --port {port}
      --served-model-name {model_id}
      --max-model-len {ctx_size}
      --gpu-memory-utilization {gpu_mem_util}
      {tp_flag}
      {spec_flag}
      {extra_args}
    env: {CUDA_VISIBLE_DEVICES: "{gpu_ids}"}
    supports:
      gpu_placement: "CUDA_VISIBLE_DEVICES + --tensor-parallel-size (tp_flag, derived from gpu_count)"
      context_size: "--max-model-len"
      parallel: "implicit (vLLM's own continuous batching); no separate flag needed"
      quant_selection: "repo id only - vLLM prefers safetensors (bf16/fp8/awq/gptq); GGUF is experimental/unsupported for most archs"
      speculative: "--speculative-config '<json>' (spec_json, built from spec-draft-model + num_speculative_tokens)"
      mmproj: "none - vLLM loads the vision tower from the model repo itself, no separate mmproj flag"
      prefix_caching: "automatic (V1 default, --no-enable-prefix-caching to disable) - text HIT confirmed (measured 2026-09-17: 49.8% hit rate, second-request latency 0.205s -> 0.129s over a shared 4046-token prefix); image prefix reuse not tested here"
    build: {script: null, note: "uv venv + uv pip install vllm; needs CUDA on PATH (module cuda/12.9.0-cinr here)"}

  dwarfstar:
    # antirez/ds4 (MIT, C). ds4-server: OpenAI-compatible API, one process per model like vLLM.
    kind: single-model
    health_endpoint: /health
    models_endpoint: /v1/models
    port_base: 8200
    build:
      repo: https://github.com/antirez/ds4
      dir: vendor/ds4
      cmd: "make ds4-server CUDA_ARCH=sm_86"   # the Makefile takes an explicit -arch; sm_86 = Ampere (our A5000s)
      status: |
        MEASURED 2026-09-17 on gpu2260: `make ds4-server CUDA_ARCH=sm_86` BUILT CLEANLY in 3m54.6s
        (nvcc -arch=sm_86, no errors/warnings of note) - the README only calls out Ada Lovelace/L40S
        and DGX Spark explicitly, but the Makefile's CUDA_ARCH is a generic nvcc -arch value and
        Ampere sm_86 built fine. `./ds4-server --help` runs. NOT run against real weights: ds4 uses
        its own GGUF variants (antirez/deepseek-v4-gguf), not llama.cpp's unsloth GGUFs already on
        disk here, and the smallest one (DeepSeek-V4-Flash-IQ2XXS..., ds4f-q2) is 80.76 GiB per the
        HF tree API (checked 2026-09-17) - not downloaded without the operator's go-ahead. All other
        variants are larger (Q4 153 GiB, MXFP4 145 GiB, up to Pro at 432-826 GiB combined shards).
        GPU7 (the only GPU with meaningful free VRAM while deepseek-v4-flash occupies all 8) had
        ~9 GiB free, not enough for even the Q2 quant, so a live serve test needs either the
        deepseek-v4-flash lane freed or ~90+ GiB of free VRAM elsewhere - operator decision.
    cmd: >-
      {bin}/ds4-server
      --model {model_path}
      --port {port}
      --ctx-size {ctx_size}
      {extra_args}
    env: {CUDA_VISIBLE_DEVICES: "{gpu_ids}"}
    supports:
      gpu_placement: "CUDA_VISIBLE_DEVICES (single-GPU per docs at last check; verify against build)"
      context_size: "--ctx-size"
      parallel: "unknown - check ds4-server --help after building"
      quant_selection: "ds4's own weight format, not GGUF - needs a converted/quantized ds4 checkpoint"
      speculative: "unknown - not documented as of 2026-09-17"
      mmproj: "unsupported (text-only engine)"
      prefix_caching: "unknown - not documented as of 2026-09-17"

# Reject-at-launch rules bin/llm enforces before rendering `cmd` (see render_backend_cmd):
#   - spec-draft-* set but the engine's `supports.speculative` is missing/"unknown" -> error
#   - mmproj set (or hf-repo implies one) but the engine's `supports.mmproj` is "unsupported"/missing -> error
#   - hf-repo names a GGUF (":Q4_..." etc.) for an engine whose quant_selection says GGUF is unsupported -> error, with the exact repo/quant in the message
