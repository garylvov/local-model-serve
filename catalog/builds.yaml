# llama.cpp build variants. `scripts/build-llama.sh <variant>` builds into vendor/llama.cpp-<variant>/
# (the default variant `master` keeps the historical path vendor/llama.cpp/).
# A catalog model or preset may point at a variant; `llm build <variant>` / `llm builds` drive this.
builds:
  master:
    remote: https://github.com/ggml-org/llama.cpp
    ref: 7ceed8737fdb4eb09b4760e77bd12d38012de5a8   # pinned: the commit this repo was verified against (tag b11002)
    dir: vendor/llama.cpp
    cmake: [-DGGML_CUDA=ON, -DLLAMA_CURL=OFF]
    status: built+verified on gpu2260 2026-09-16 (see _out.md)

  poolside-laguna:
    remote: https://github.com/poolsideai/llama.cpp
    ref: laguna          # fork branch; the Laguna card says full DFlash support lives here
    dir: vendor/llama.cpp-poolside-laguna
    cmake: [-DGGML_CUDA=ON, -DLLAMA_CURL=OFF]
    for: [laguna-s-2.1, laguna-xs-2.1]
    status: NOT built (operator deciding; upstream rejects the Laguna DFlash sidecar, issue #26669)

  glm53:
    remote: https://github.com/ggml-org/llama.cpp
    ref: refs/pull/27754/head   # GLM-5.3-Flash (glm5next) text+vision PR; #27752 is text-only, #27773 is an alternative
    dir: vendor/llama.cpp-glm53
    cmake: [-DGGML_CUDA=ON, -DLLAMA_CURL=OFF]
    for: [glm-5.3-flash]
    status: |
      llama-server BUILT on gpu2260 2026-09-16 (~6 min, `vendor/llama.cpp-glm53/build/bin/`,
      807M build dir). `cmake --build --target llama-app` failed with "No rule to make target
      'llama-app'" - this PR branch predates that CMake target - so `llm build` reports a nonzero
      exit even though llama-server/llama-cli/llama-bench/llama-gguf-split all linked fine. Not
      run against real weights (GLM-5.3-Flash weights explicitly not downloaded per operator
      instruction, 146 GiB).
    notes: |
      Needs NVIDIA_TF32_OVERRIDE=0 and -fa off per the PR; watch issue #26027 (GLM_DSA CUDA
      corruption). 2026-09-16 operator check: #27754 (danielhanchen) is the only one of three
      competing PRs (#27752 text-only, #27773 alternative) still mergeable against master; 45
      commits, updated today. Image support needs the unsloth GGUFs. Long-context SOFT_MAX crash
      fixes exist in forks, see #28282 (not confirmed merged into this PR - check before trusting
      long ctx).

  qwen-mtp:
    remote: https://github.com/ggml-org/llama.cpp
    ref: refs/pull/28243/head   # "models: Qwen3.8-Flash-Next MTP" - draft, mergeable_state dirty
    dir: vendor/llama.cpp-qwen-mtp
    cmake: [-DGGML_CUDA=ON, -DLLAMA_CURL=OFF]
    for: [qwen3.8-flash-next, qwen3.8-27b]   # MTP draft weights exist for both (unsloth, see notes) - see caveat below
    status: |
      llama-server BUILT on gpu2260 2026-09-16 (~4 min), same `llama-app` gap as glm53 (harmless -
      only the CLI downloader target, not the router). MEASURED: this binary FAILS to load
      qwen3.8-27b (UD-Q5_K_XL) - "llama_model_load: error loading model: missing tensor
      'blk.64.ssm_conv1d.weight'" - i.e. this PR's tree predates (or conflicts with) the qwen35
      architecture support merged into master separately (PR #19435/#19468), so `for:
      qwen3.8-27b` above does not actually work with this build today despite unsloth publishing
      MTP draft weights for it. Not tested against qwen3.8-flash-next (qwen4exp arch, PR #27742) -
      that would need freeing GPUs 0-5 (currently serving the required flash-next instance) for a
      103 GiB reload, judged too disruptive to try live; unconfirmed either way.
    notes: |
      Still a DRAFT as of 2026-09-16, head fork danielhanchen/llama.cpp branch qwen4exp/mtp,
      mergeable_state=dirty because #28896 landed first and now conflicts (a reviewer asked for a
      rebase). refs/pull/28243/head is the PR's own tip commit, independent of that merge-ability
      flag, so it clones/builds fine even while dirty - do NOT try to rebase it here; if it stops
      building against a newer master, re-pin to the PR's latest head commit instead. Builds on
      top of PR #27836. Claims 1.3-2x decode speedup. Known bug: #27102, a CUDA-graph crash on
      Blackwell with this branch (not our arch, A5000/Ampere sm_86 - unconfirmed here either way,
      check for it explicitly). One commenter validated CUDA + Vulkan on consumer cards.
      Official MTP draft weights confirmed on HF (2026-09-16, HF tree API):
        unsloth/Qwen3.8-Flash-Next-GGUF: MTP/mtp-Qwen3.8-Flash-Next-{BF16 7.77G, Q4_K_M 2.79G, ...}
        unsloth/Qwen3.8-27B-GGUF: MTP/mtp-Qwen3.8-27B-Q4_0.gguf (1.27 GiB)
      Vision must NOT share a process with a draft model: mmproj + speculative decoding stalls
      ~500s and returns HTTP 500 on image requests (#27408, already true of qwen3.8-27b-vision).
